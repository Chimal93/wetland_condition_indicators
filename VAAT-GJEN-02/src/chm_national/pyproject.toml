# Python environment for the national canopy-height run (VAAT-GJEN-02):
# CHMv1 (Meta HighResCanopyHeight, aerial checkpoint) and CHMv2 (Meta/WRI,
# DINOv3) on GPU over all AR5 mire. Separate from ../chm_model, which is the
# published CPU setup (torch 2.0.1) and stays as the reference.
#
# Built and run by docker/run_VAAT-GJEN-02_national_chm.sh; versions are
# pinned in uv.lock.

[project]
name = "no-gjen-002-chm-national"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.24.1",
    "numpy",
    "rasterio",
    "pyogrio",
    "shapely",
    "pandas",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
